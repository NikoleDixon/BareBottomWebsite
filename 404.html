<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bare Bottom Pool and Spa</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // Saves the current URL to sessionStorage, then redirects to the root
      // index.html. The redirect script in index.html reads it back and
      // restores the correct path so React Router can take over.
      var pathSegmentsToKeep = 1; // keep /BareBottomWebsite/ as the base

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
